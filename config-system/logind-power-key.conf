# Installed by Ombuntu. The power key opens Omarchy's power menu (XF86PowerOff in
# bindings/utilities.conf); without this, logind also powers off the moment it is
# tapped, on any keyboard or receiver that has one. Omarchy sets the same on Arch.
# Xubuntu is unaffected: xfce4-power-manager takes the power key itself.
[Login]
HandlePowerKey=ignore
