# Installed by Ombuntu. Ubuntu's systemd-oomd defaults act on memory pressure only
# (ManagedOOMSwap=auto), so a slow leak can fill swap without crossing the pressure limit,
# and the kernel OOM killer steps in instead - after minutes of thrashing, and on whatever
# it picks. This lets oomd kill the app using the most swap once memory and swap are both
# over SwapUsedLimit (90%). Scoped to user sessions; the compositor opts out with
# ManagedOOMPreference=omit, so it is never the one picked.
[Service]
ManagedOOMSwap=kill
