screencopy {
    # Ask which screen or window to share every time instead of remembering the choice
    # (Omarchy's default is true for convenience).
    allow_token_by_default = false

    # No custom_picker_binary here: Omarchy points this at hyprland-preview-share-picker,
    # which only exists in Arch's hyprland-qtutils. Ubuntu's package ships hyprland-dialog,
    # hyprland-donate-screen and hyprland-update-screen only, so naming it left xdph
    # launching a binary that is not there, and every share request came back to the app as
    # "cancelled by user". Unset, xdph uses its own hyprland-share-picker, which Ubuntu does
    # package with xdg-desktop-portal-hyprland.
}
