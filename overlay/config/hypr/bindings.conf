# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(ombuntu-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(ombuntu-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, ombuntu-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(ombuntu-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, ombuntu-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, ombuntu-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, ombuntu-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, ombuntu-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, ombuntu-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, ombuntu-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, ombuntu-launch-or-focus ^signal$ "uwsm-app -- signal-desktop --password-store=gnome-libsecret"
bindd = SUPER SHIFT, O, Obsidian, exec, ombuntu-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, ombuntu-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, ombuntu-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, Y, YouTube, exec, ombuntu-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, ombuntu-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, ombuntu-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, ombuntu-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, ombuntu-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, ombuntu-launch-webapp "https://x.com/compose/post"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, ombuntu-menu

