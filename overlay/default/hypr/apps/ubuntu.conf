# Ubuntu stand-ins for Omarchy's TUIs: float them like the originals
windowrule = tag +floating-window, match:class (org.omarchy.nmtui|org.omarchy.pulsemixer|org.omarchy.bluetoothctl|org.omarchy.nvim)
windowrule = tag +floating-window, match:class (blueman-manager|.blueman-manager-wrapped|nm-connection-editor|pavucontrol)
windowrule = tag +floating-window, match:class org.gnome.DiskUtility

# Beginner cheatsheet opens as a floating app window
windowrule = float on, match:title ^Ombuntu Cheatsheet$
windowrule = center on, match:title ^Ombuntu Cheatsheet$
windowrule = size 1180 860, match:title ^Ombuntu Cheatsheet$
